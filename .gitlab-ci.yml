---
stages:
  - publish

include:
  - project: devops/pipelines
    ref: semantic-release@2.0.0
    file:
      - /semantic-release/publish.gitlab-ci.yml

semantic-release:
  stage: publish
  extends: .semantic-release
  before_script:
    # @semantic-release/npm never writes ~/.npmrc — it writes a tempfile and passes it via --userconfig to its own npm calls only
    # so this authenticated npmrc is what `npm stage publish` uses, regardless of the npmPublish setting
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^(master|main|alpha|beta|rc|next)$/'
      interruptible: true
    - when: never
